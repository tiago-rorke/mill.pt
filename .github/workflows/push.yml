name: Push to WordPress

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Push files changed since this commit (blank = since the last-wp-push tag)'
        required: false

permissions:
  contents: write

concurrency: wp-sync

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Find base commit
        id: base
        run: |
          BASE="${{ inputs.since }}"
          if [ -z "$BASE" ]; then BASE=$(git rev-parse -q --verify refs/tags/last-wp-push || true); fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
      - run: node scripts/push.js
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          BEFORE_SHA: ${{ steps.base.outputs.sha }}
          AFTER_SHA: ${{ github.sha }}
      - name: Commit write-back (ids, slugs, timestamps)
        if: always()
        run: |
          git config user.name "wp-sync[bot]"
          git config user.email "wp-sync@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || (git commit -m "Record WordPress ids and timestamps [skip ci]" && git pull --rebase && git push)
      - name: Move last-push tag
        if: success()
        run: |
          git tag -f last-wp-push HEAD
          git push -f origin last-wp-push