name: Push to WordPress

on:
  push:
    branches: [main]
    paths: ['content/**']

permissions:
  contents: write

concurrency: wp-sync

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/push.js
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          # ALLOW_TRASH: 'true'   # uncomment to let deleted files trash the post
      - name: Commit write-back (ids, slugs, timestamps)
        if: always()
        run: |
          git config user.name "wp-sync[bot]"
          git config user.email "wp-sync@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || (git commit -m "Record WordPress ids and timestamps [skip ci]" && git pull --rebase && git push)
