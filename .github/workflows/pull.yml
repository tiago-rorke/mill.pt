name: Pull from WordPress

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency: wp-sync

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/pull.js
        env:
          WP_URL: ${{ secrets.WP_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      - name: Commit changes
        run: |
          git config user.name "wp-sync[bot]"
          git config user.email "wp-sync@users.noreply.github.com"
          git add -A content
          git diff --cached --quiet || (git commit -m "Sync from WordPress [skip ci]" && git push)
